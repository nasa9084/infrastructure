# Signs the kkids-sync reconciler in to Amazon with its own browser, shown through noVNC on the LAN
# (NodePort 30680, not through Cloudflare). Applied by hand and deleted afterwards; see ../README.org.
# Writes /var/lib/kkids-sync/reconciler/storage-state.json once the parent dashboard shows.
---
apiVersion: v1
kind: Pod
metadata:
  name: kkids-sync-login
  namespace: kkids-sync
  labels:
    app: kkids-sync-login
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  activeDeadlineSeconds: 1200
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
  containers:
    - name: login
      image: ghcr.io/nasa9084/kkids-sync-reconciler:0.1.6
      imagePullPolicy: IfNotPresent
      command: ["/usr/bin/tini", "--", "/usr/local/bin/kkids-sync-login"]
      ports:
        - name: novnc
          containerPort: 6080
      resources:
        requests:
          cpu: 200m
          memory: 384Mi
        limits:
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: data
          mountPath: /data
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: data
      hostPath:
        path: /var/lib/kkids-sync/reconciler
        type: Directory
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kkids-sync-login
  namespace: kkids-sync
spec:
  type: NodePort
  selector:
    app: kkids-sync-login
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
      nodePort: 30680
