# Pages (8080) only from the cloudflared connector of the "k8s" tunnel; the internal API (8081) only
# from the reconciler's pods. Traffic from the node itself (kubelet probes) is still allowed by
# kube-router. The reconciler's egress (the Amazon dashboard) is not restricted.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kkids-sync-web
  namespace: kkids-sync
spec:
  podSelector:
    matchLabels:
      app: kkids-sync-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: kkids-sync-reconciler
      ports:
        - protocol: TCP
          port: 8081
