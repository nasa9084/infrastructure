# Only the cloudflared connectors may reach the MCP server. The server has no authentication of its
# own (see grocy-mcp.yaml). Both connector namespaces are allowed so that this keeps working if the
# connector in mcp-line-bot also runs the "k8s" tunnel.
# Enforced by kube-router (--run-firewall=true); traffic from the node itself (kubelet probes) is
# still allowed by kube-router.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grocy-mcp-from-cloudflared
  namespace: mcp-grocy
spec:
  podSelector:
    matchLabels:
      app: grocy-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [mcp-proxmox, mcp-line-bot]
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8000
