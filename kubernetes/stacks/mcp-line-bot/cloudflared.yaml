# Cloudflare Tunnel connector for mcp-line-bot.
# The namespace and the Secret (cloudflared-token, key TUNNEL_TOKEN) are created by hand; see ../../README.org.
# The tag is pinned on purpose: 'latest' keeps whatever image was cached on the node, so a restart does not upgrade it.
# Versions before 2026.10.2 trust compromised eMudhra certificates (https://blog.cloudflare.com/emudhra-certificate-compromise/).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: mcp-line-bot
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.3
          imagePullPolicy: Always
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: TUNNEL_TOKEN
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
