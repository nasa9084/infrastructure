# LINE Bot MCP server (line-bot-mcp-server, stdio) exposed as Streamable HTTP by supergateway,
# reached through the Cloudflare tunnel "k8s" (cloudflare/tunnel.tf).
# Moved into git as it was applied by hand. The image is built on the node (imagePullPolicy: Never).
# The namespace and the Secret (line-bot-mcp, key CHANNEL_ACCESS_TOKEN) are created by hand;
# see ../../README.org.
#
# supergateway has no inbound auth. Authentication is done by Cloudflare Access: cloudflared forwards
# a request only with a valid Access JWT for the mcp-line-bot app (origin_request.access), and
# networkpolicy.yaml lets only that cloudflared reach this pod.
# Memory: line-bot-mcp OOMs at 256Mi; supergateway starts a server process per session.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: line-bot-mcp
  namespace: mcp-line-bot
  labels:
    app: line-bot-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: line-bot-mcp
  template:
    metadata:
      labels:
        app: line-bot-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: line-bot-mcp
          image: localhost/line-bot-mcp-server:0.5.0
          imagePullPolicy: Never
          env:
            - name: CHANNEL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: line-bot-mcp
                  key: CHANNEL_ACCESS_TOKEN
          ports:
            - name: mcp
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 400m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: line-bot-mcp
  namespace: mcp-line-bot
spec:
  selector:
    app: line-bot-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
