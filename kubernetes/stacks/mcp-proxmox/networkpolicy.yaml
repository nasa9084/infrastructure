# Only the cloudflared connector may reach the MCP server. The server has no authentication of its
# own (see proxmox-mcp.yaml), so this keeps other pods (e.g. grafana-pdc) away from it.
# Enforced by kube-router (--run-firewall=true); traffic from the node itself (kubelet probes) is
# still allowed by kube-router.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxmox-mcp-from-cloudflared
  namespace: mcp-proxmox
spec:
  podSelector:
    matchLabels:
      app: proxmox-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8000
